<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ex1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bienvenu à l'hotel <em>les rosiers</em></h1>
    <p>Faites vos réservations via le formulaire ci-dessous.</p>
    <p>Nous vous souhaitons un agréable séjour.</p>
    <fieldset>
        <legend>Réservation chambre</legend>
        <form action="reservation.php" method="post">
          <table>
            <tr>
              <td>Nom</td>
              <td><input type="text" name="nom" required></td>
            </tr>
            <tr>
              <td>Prénom</td>
              <td><input type="text" name="prenom" required></td>
            </tr>
            <tr>
              <td>E-mail</td>
              <td><input type="email" name="email" required></td>
            </tr>
            <tr>
              <td>Téléphone</td>
              <td><input type="number" name="tel" required></td>
            </tr>
            <tr>
              <td>Type de chambre</td>
              <td>
                <select name="typechambre" required>
                  <option value="standard">Chambre Standard</option>
                  <option value="deluxe">Chambre Deluxe</option>
                  <option value="suite">Suite</option>
                  <option value="suitejunior">Suite Junior</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Date d'arrivée</td>
              <td><input type="date" name="date" min="2025-01-24" required></td>
            </tr>
            <tr>
              <td>Nombre de nuit</td>
              <td><input type="number" name="nbnuit" required></td>
            </tr>
            <tr>
              <td>Petit déjeuner ?</td>
              <td>
                <label><input type="radio" name="acceptation" value="oui" required> Oui</label>
                <label><input type="radio" name="acceptation" value="non"> Non</label>
              </td>
            </tr>
            <tr>
              <td><input type="submit" value="Valider"></td>
              <td><input type="reset" value="Annuler"></td>
            </tr>
          </table>
        </form>
      </fieldset>      
</body>
</html>
